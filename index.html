<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>EVA.WATCH</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.crt{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.15) 3px),radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.5) 100%)}
.roll{position:fixed;left:0;right:0;height:18%;pointer-events:none;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.035),rgba(255,255,255,0));animation:r 9s linear infinite}
@keyframes r{from{top:-20%}to{top:110%}}
/* camada de cor do olho: multiply mantém o preto e tinge só os caracteres */
#tint{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;background:#fff;opacity:0;transition:background-color 2.5s ease,opacity 2.5s ease}
/* aviso de conexão (canto superior esquerdo) */
#net{position:fixed;left:calc(env(safe-area-inset-left,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 14px);font:bold 12px "Courier New",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.22em;color:#ecece8;opacity:0;transition:opacity .6s;pointer-events:none;text-shadow:0 0 6px rgba(236,236,232,.35)}
#net.on{opacity:.85}
#net i{font-style:normal;animation:bl 1s steps(2,start) infinite}
@keyframes bl{to{visibility:hidden}}
/* cursor próprio: anel com contorno preto para não se perder no meio dos caracteres */
#cur{position:fixed;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;box-sizing:border-box;border:1.5px solid #ecece8;box-shadow:0 0 0 1.5px #000,inset 0 0 0 1.5px #000;pointer-events:none;opacity:0;z-index:9;transition:opacity .25s,width .15s,height .15s,margin .15s,background .15s}
#cur::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;background:#ecece8;box-shadow:0 0 0 1.5px #000}
#cur.show{opacity:1}
#cur.hot{width:30px;height:30px;margin:-15px 0 0 -15px;background:rgba(236,236,232,.14)}
</style></head><body>
<canvas id="c"></canvas><div class="crt"></div><div class="roll"></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:true});
const G=[' ','.',"'`,",':;','-~','+=','*!','i|1','lI7','xo','XO#','%&8','WM','@$B'];
const NL=G.length,AL=[0.34,0.46,0.58,0.7,0.85,1],NA=6;
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>v/16);
const GM=new Float32Array(256);for(let i=0;i<256;i++)GM[i]=Math.pow(i/255,0.85)*(NL-1);
const FT=new Float32Array(256);
function hash(x,y){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
for(let i=0;i<256;i++)FT[i]=hash(i,99);
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function pvn(x,y,p){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const x0=((xi%p)+p)%p,x1=(x0+1)%p;const a=hash(x0,yi),b=hash(x1,yi),c=hash(x0,yi+1),d=hash(x1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const cl=(v,a,b)=>v<a?a:v>b?b:v;
function sm(a,b,x){const t=cl((x-a)/(b-a),0,1);return t*t*(3-2*t)}

let sc=1;try{sc=parseFloat(localStorage.getItem('evaScale'))||1}catch(e){}
const qs=parseFloat(new URLSearchParams(location.search).get('scale'));if(qs)sc=qs;
let W,H,dpr,tw,th,cols,rows,N,S,cx,cy,atlas,q=1,off=[],cnt=[];
let X,Y,VIG,SKT,SCT,DI,GH,PH,ST,STV,prev;
// --- $EVA price: own fine-grained ASCII layer (independent of the eye's grid, so it stays sharp) ---
// under the eye by default; press P (or ?price=corner) for the bottom-right corner
const EVA='0x45D9831d8751B2325f3DBf48db748723726e1c8c',FF='"Courier New",ui-monospace,Menlo,Consolas,monospace',MODES=['under','corner'];
let pMode=(new URLSearchParams(location.search).get('price')||'under').toLowerCase();if(!MODES.includes(pMode))pMode='under';
let priceStr='$--.--';
const tc=document.createElement('canvas');tc.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .6s';
document.body.insertBefore(tc,document.querySelector('.crt'));
const tint=document.createElement('div');tint.id='tint';document.body.insertBefore(tint,tc); // acima do olho, abaixo do preço
const net=document.createElement('div');net.id='net';net.innerHTML='OFFLINE<i>_</i>';document.body.insertBefore(net,document.querySelector('.crt'));
const cur=document.createElement('div');cur.id='cur';document.body.appendChild(cur);
const tctx=tc.getContext('2d'),TC=['.',':','+','*','#','@'];let tAtlas=null,tAtw=0;
// estado extra do painel de preço: variação 24h
let chgStr='',chgDir=0,fails=0,lblMode=0,boxR=null,hot=false,curT=0,lblT=0; // lblMode: 0 EVA/USD, 1 COPY CA (hover), 2 COPIED
function buildText(){
  if(!N)return;
  tc.width=cv.width;tc.height=cv.height;
  const t2=Math.max(2,Math.round(Math.max(W/340,4)*dpr*0.5)),h2=Math.round(t2*1.75);
  if(tAtw!==t2){tAtw=t2;tAtlas=document.createElement('canvas');tAtlas.width=t2*TC.length;tAtlas.height=h2;
    const a=tAtlas.getContext('2d');a.fillStyle='#ecece8';a.textAlign='center';a.textBaseline='middle';a.font='bold '+(h2*0.95)+'px '+FF;
    TC.forEach((ch,k)=>a.fillText(ch,k*t2+t2/2,h2/2+h2*0.04))}
  const c2=Math.ceil(cv.width/t2),r2=Math.ceil(cv.height/h2),Sc=S/t2,compact=W<H*0.9; // compact = celular em pé
  const m=document.createElement('canvas');m.width=c2;m.height=r2;
  const g=m.getContext('2d',{willReadFrequently:true});g.scale(1,1/1.75);g.textBaseline='alphabetic';
  // helpers de desenho na máscara (x em colunas; y em unidades isotrópicas, 1 linha = 1.75)
  const FS=a=>{g.fillStyle='rgba(255,255,255,'+a+')'};
  const TX=(s,x,y,em,a)=>{FS(a);g.font='bold '+em+'px '+FF;g.fillText(s,x,y)};
  const RC=(x,y,w,h,a)=>{FS(a);g.fillRect(x,y*1.75,w,h*1.75)}; // coluna, linha, larg(cols), alt(linhas)
  const wd=(s,em)=>{g.font='bold '+em+'px '+FF;return g.measureText(s).width};
  const cw=em=>chgStr?0.7*em+0.3*em+wd(chgStr,em):0;
  const CH=(x,y,em,a)=>{ // seta (▲ ▼ ou = ) + variação 24h
    const wA=0.7*em,hA=0.62*em;FS(a);
    if(chgDir>0){g.beginPath();g.moveTo(x,y);g.lineTo(x+wA,y);g.lineTo(x+wA/2,y-hA);g.closePath();g.fill()}
    else if(chgDir<0){g.beginPath();g.moveTo(x,y-hA);g.lineTo(x+wA,y-hA);g.lineTo(x+wA/2,y);g.closePath();g.fill()}
    else g.fillRect(x,y-hA*0.6,wA,hA*0.24);
    TX(chgStr,x+wA+0.3*em,y,em,a);
  };
  let x0,x1,top,bot,padX,padY,lvl,emRef=0;
  if(compact){
    // celular: 2 linhas maiores e legíveis. 1ª: EVA + preço; 2ª: ticker (esq.) e variação 24h (dir.)
    const corner=pMode==='corner',lt=lblMode===2?'COPIED':lblMode===1?'COPY CA':'EVA/USDT';
    lvl=corner?0.86:0.92;
    const bud=c2*(corner?0.60:0.80),gch=0.4;
    const e1=Math.min((corner?0.20:0.27)*Sc,bud/(0.6*(3+gch+priceStr.length)));
    const wE=wd('EVA',e1),wP=wd(priceStr,e1),gp=gch*0.6*e1,w1=wE+gp+wP;
    const u2=0.6*lt.length+(chgStr?1+0.6*chgStr.length:0)+1.0; // largura da 2ª linha por unidade de fonte (com folga)
    const e2=Math.max(9,Math.min(e1*0.5,w1/u2)),gap2=0.28*e1;
    padX=0.018*Sc;padY=0.012*S/h2;
    const below=(gap2+0.72*e2+0.25*e2)/1.75,rowMax=r2-11-below-padY;
    const row=corner?rowMax:Math.min((cy+0.68*S)/h2,rowMax);
    const Y1=row*1.75,Y2=Y1+gap2+0.72*e2;
    x1=corner?c2-16:(c2+w1)/2;x0=x1-w1;
    TX('EVA',x0,Y1,e1,1);TX(priceStr,x0+wE+gp,Y1,e1,1);
    TX(lt,x0,Y2,e2,0.85);if(chgStr)CH(x1-cw(e2),Y2,e2,0.85);
    top=row-0.75*e1/1.75;bot=(Y2+0.3*e2)/1.75;emRef=e1;
  }else if(pMode==='corner'){
    lvl=0.8;const txt='EVA  '+priceStr,n=txt.length+(chgStr?chgStr.length+3:0),em=Math.min(18,c2*0.44/(0.6*n)),row=r2-9;
    const emC=em*0.62,w=wd(txt,em),gc=0.5*em,cW=cw(emC);
    x1=c2-16;x0=x1-w-(cW?gc+cW:0);
    emRef=em;TX(txt,x0,row*1.75,em,1);if(chgStr)CH(x0+w+gc,row*1.75,emC,0.78);
    top=row-0.75*em/1.75;bot=row+0.3*em/1.75;padX=4;padY=2;
  }else{
    lvl=0.92;let eE=0.30*Sc,eP=0.17*Sc,eC=0.085*Sc;
    const gap=0.08*Sc,gc=0.05*Sc;
    const tot=wd('EVA',eE)+gap+wd(priceStr,eP)+(chgStr?gc+cw(eC):0);
    const k=Math.min(1,c2*0.80/tot);eE*=k;eP*=k;eC*=k;
    const wE=wd('EVA',eE),wP=wd(priceStr,eP),cW=cw(eC),gp=gap*k,gk=gc*k;
    padX=0.018*Sc;padY=0.012*S/h2;
    const row=Math.min((cy+0.68*S)/h2,r2-9-0.3*eE/1.75-padY);
    const tw2=wE+gp+wP+(cW?gk+cW:0);
    x0=(c2-tw2)/2;x1=x0+tw2;
    TX('EVA',x0,row*1.75,eE,1);TX(priceStr,x0+wE+gp,row*1.75,eP,1);
    if(chgStr)CH(x0+wE+gp+wP+gk,row*1.75,eC,0.78);
    top=row-0.75*eE/1.75;bot=row+0.3*eE/1.75;
  }
  const d1=g.getImageData(0,0,c2,r2).data;
  if(pMode!=='corner'||compact){ // encaixa a caixa na tinta real para o respiro de cima e de baixo ser idêntico
    let mr=1e9,Mr=-1,mc=1e9,Mc=-1;
    for(let r=Math.max(0,Math.floor(top-6));r<Math.min(r2,Math.ceil(bot+6));r++)
      for(let c=Math.max(0,Math.floor(x0-6));c<Math.min(c2,Math.ceil(x1+6));c++)
        if(d1[(r*c2+c)*4+3]>30){if(r<mr)mr=r;if(r>Mr)Mr=r;if(c<mc)mc=c;if(c>Mc)Mc=c}
    if(Mr>=0){top=mr;bot=Mr+1;x0=mc;x1=Mc+1}
  }
  const bx0=Math.max(0,Math.floor(x0-padX)),bx1=Math.min(c2,Math.ceil(x1+padX)),by0=Math.max(0,Math.floor(top-padY)),by1=Math.min(r2,Math.ceil(bot+padY));
  // --- moldura: filete pontilhado + cantoneiras sólidas (estilo HUD / terminal) ---
  const fx=Math.max(3,Math.round(0.022*Sc)),fy=Math.max(2,Math.round(fx/1.75)),vw=2;
  const fX0=Math.max(3,bx0-fx),fX1=Math.min(c2-3,bx1+fx),fY0=Math.max(4,by0-fy),fY1=Math.min(r2-2,by1+fy);
  const HL=0.30,BR=0.92,lc=Math.max(6,Math.round(0.07*Sc)),lr=Math.max(3,Math.round(lc/1.75));
  RC(fX0,fY0,fX1-fX0,1,HL);RC(fX0,fY1-1,fX1-fX0,1,HL);RC(fX0,fY0,vw,fY1-fY0,HL);RC(fX1-vw,fY0,vw,fY1-fY0,HL);
  RC(fX0,fY0,lc,1,BR);RC(fX0,fY0,vw,lr,BR);RC(fX1-lc,fY0,lc,1,BR);RC(fX1-vw,fY0,vw,lr,BR);
  RC(fX0,fY1-1,lc,1,BR);RC(fX0,fY1-lr,vw,lr,BR);RC(fX1-lc,fY1-1,lc,1,BR);RC(fX1-vw,fY1-lr,vw,lr,BR);
  // --- rótulo embutido na borda de cima, à direita (nas duas caixas); em hover vira COPY CA e ao copiar COPIED ---
  if(!compact){
    const eL=pMode==='corner'?Math.max(6,emRef*0.7):Math.max(7,0.08*Sc),cyL=(fY0+0.5)*1.75,lt=lblMode===2?'COPIED':lblMode===1?'COPY CA':'EVA/USDT',lw=wd(lt,eL);
    const lx=fX1-lc-3-lw;
    if(lx>fX0+lc+3){g.clearRect(lx-2,cyL-0.62*eL,lw+4,1.24*eL);TX(lt,lx,cyL+0.36*eL,eL,0.8)}
  }
  const d=g.getImageData(0,0,c2,r2).data;
  const kx0=Math.max(0,fX0-2),kx1=Math.min(c2,fX1+2),ky0=Math.max(0,fY0-2),ky1=Math.min(r2,fY1+1);
  tctx.clearRect(0,0,tc.width,tc.height);
  tctx.fillStyle='#000';tctx.fillRect(kx0*t2,ky0*h2,(kx1-kx0)*t2,(ky1-ky0)*h2);
  tctx.globalAlpha=lvl;
  for(let r=ky0;r<ky1;r++)for(let c=kx0;c<kx1;c++){
    const a=d[(r*c2+c)*4+3]/255;if(a<0.12)continue;
    tctx.drawImage(tAtlas,Math.min(5,(a*6)|0)*t2,0,t2,h2,c*t2,r*h2,t2,h2);
  }
  tctx.globalAlpha=1;
  boxR={x:fX0*t2/dpr,y:fY0*h2/dpr,w:(fX1-fX0)*t2/dpr,h:(fY1-fY0)*h2/dpr}; // área clicável (px CSS)
}
function setTint(x){ // x = variação % de 24h (a mesma da caixa); cor só pelo sinal, qualquer tamanho de variação
  if(!Number.isFinite(x)||Math.abs(x)<0.005){tint.style.opacity=0;return} // sem dado ou exatamente 0 => olho neutro
  tint.style.backgroundColor=x>0?'#9be8b0':'#ff9aa6'; // verde / vermelho pastel
  tint.style.opacity=0.55;
}
function setPrice(p,chg){
  if(!(p>0))return;
  priceStr='$'+(p>=1?p.toFixed(2):p.toPrecision(3));
  chg=(chg==null||chg==='')?NaN:+chg;
  if(Number.isFinite(chg)){const a=Math.abs(chg);chgDir=a<0.005?0:chg>0?1:-1;chgStr=a.toFixed(a<10?2:1)+'%'}else{chgStr='';chgDir=0}
  setTint(chg);
  buildText();
}
function netState(){ // OFFLINE só depois de 2 falhas seguidas (ou sem rede); o preço escurece enquanto isso
  const off=fails>=2||navigator.onLine===false;
  net.classList.toggle('on',off);tc.style.opacity=off?0.4:1;
}
const sig=()=>window.AbortSignal&&AbortSignal.timeout?AbortSignal.timeout(8000):undefined;
async function getPrice(){
  const lo=EVA.toLowerCase(),v=p=>(p.volume&&p.volume.h24)||0,L=p=>(p.liquidity&&p.liquidity.usd)||0;
  try{
    const r=await fetch('https://api.dexscreener.com/tokens/v1/arbitrum/'+EVA,{cache:'no-store',signal:sig()});
    const j=await r.json();
    // pega o par com mais volume nas últimas 24h (desempate por liquidez), evitando pools parados
    const ps=(Array.isArray(j)?j:[]).filter(p=>p.baseToken&&p.baseToken.address.toLowerCase()===lo&&+p.priceUsd>0)
      .sort((a,b)=>(v(b)-v(a))||(L(b)-L(a)));
    if(ps[0]){const pc=ps[0].priceChange||{};console.log('[eva] par:',ps[0].dexId,ps[0].pairAddress,'preço',ps[0].priceUsd,'vol24h',v(ps[0]));
      setPrice(+ps[0].priceUsd,pc.h24);fails=0;netState();return}
    console.warn('[eva] dexscreener: nenhum par válido');
  }catch(e){console.warn('[eva] dexscreener falhou',e)}
  try{
    const r=await fetch('https://api.geckoterminal.com/api/v2/simple/networks/arbitrum/token_price/'+EVA,{cache:'no-store',signal:sig()});
    const j=await r.json();const p=+j.data.attributes.token_prices[lo];
    if(p>0){setPrice(p);fails=0;netState();return}
  }catch(e){console.warn('[eva] gecko falhou',e)}
  fails++;netState();
}
addEventListener('offline',netState);addEventListener('online',()=>{netState();getPrice()});
// --- cursor próprio (some após 2,5 s parado) + clique na caixa copia o contrato ---
const inBox=(x,y)=>boxR&&x>=boxR.x-6&&x<=boxR.x+boxR.w+6&&y>=boxR.y-10&&y<=boxR.y+boxR.h+6;
function setLbl(m){if(lblMode!==m){lblMode=m;buildText()}}
addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  cur.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)';cur.classList.add('show');
  clearTimeout(curT);curT=setTimeout(()=>{cur.classList.remove('show','hot');hot=false;if(lblMode===1)setLbl(0)},2500);
  const h=inBox(e.clientX,e.clientY);cur.classList.toggle('hot',h);
  if(h!==hot){hot=h;if(lblMode!==2)setLbl(h?1:0)}
});
document.documentElement.addEventListener('mouseleave',()=>{cur.classList.remove('show','hot');hot=false;if(lblMode===1)setLbl(0)});
function copyCA(){
  const done=()=>{setLbl(2);clearTimeout(lblT);lblT=setTimeout(()=>{lblMode=hot?1:0;buildText()},1600)};
  const fb=()=>{const t=document.createElement('textarea');t.value=EVA;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();
    try{if(document.execCommand('copy'))done()}catch(_){}t.remove()};
  try{navigator.clipboard.writeText(EVA).then(done,fb)}catch(e){fb()}
}
addEventListener('click',e=>{if(inBox(e.clientX,e.clientY))copyCA()});
addEventListener('keydown',e=>{if(e.key==='p'||e.key==='P'){pMode=pMode==='under'?'corner':'under';buildText()}});
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  tw=Math.max(3,Math.round(Math.max(W/340,4)*q*dpr));th=Math.round(tw*1.75);
  cols=Math.ceil(cv.width/tw);rows=Math.ceil(cv.height/th);N=cols*rows;
  S=(W<H*0.9?W*0.45:Math.min(W*0.34,H*0.78))*sc*dpr;cx=cv.width/2;cy=cv.height/2;
  // glyph atlas: one row per alpha level, so no globalAlpha changes at draw time
  const all=G.join('');atlas=document.createElement('canvas');atlas.width=tw*all.length;atlas.height=th*NA;
  const a=atlas.getContext('2d');a.textAlign='center';a.textBaseline='middle';
  off=[];cnt=[];let k=0;
  G.forEach((g,lv)=>{off.push(k);cnt.push(g.length);
    for(const ch of g){if(ch!==' ')for(let r=0;r<NA;r++){a.fillStyle='rgba(236,236,232,'+AL[r]+')';
      a.font=(lv>=8?'bold ':'')+(th*0.95)+'px "Courier New",ui-monospace,Menlo,Consolas,monospace';
      a.fillText(ch,k*tw+tw/2,r*th+th/2+th*0.04)}k++}});
  // precompute everything that never changes per cell
  X=new Float32Array(N);Y=new Float32Array(N);VIG=new Float32Array(N);SKT=new Float32Array(N);SCT=new Float32Array(N);
  DI=new Float32Array(N);GH=new Uint8Array(N);PH=new Float32Array(N);ST=new Uint8Array(N);STV=new Float32Array(N);
  prev=new Uint16Array(N);ctx.clearRect(0,0,cv.width,cv.height);
  let i=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++,i++){
    const px=(c+0.5)*tw,py=(r+0.5)*th,x=(px-cx)/S,y=(py-cy)/S;X[i]=x;Y[i]=y;
    const rx=(px-cx)/cx,ry=(py-cy)/cy*0.9;VIG[i]=1-0.96*sm(0.72,1.25,Math.sqrt(rx*rx+ry*ry));
    SKT[i]=(vn(x*70,y*70)-0.5)*0.15+(vn(x*18,y*18)-0.5)*0.12+0.04*Math.sin(y*110+vn(x*5,y*5)*6);
    const r1=1-Math.abs(2*vn(x*14+3,y*30)-1);
    SCT[i]=0.80-0.5*Math.pow(Math.abs(x),2.6)-Math.pow(r1,14)*0.16*(0.3+Math.abs(x))+(vn(x*90,y*90)-0.5)*0.07;
    DI[i]=(BAY[(r&3)*4+(c&3)]-0.5)*0.9+(hash(c,r)-0.5)*0.35;
    GH[i]=hash(c*7+3,r*13)*255;PH[i]=hash(c,r+500);
  }
  i=0;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++,i++){
    if(VIG[i]<0.02){ST[i]=1;STV[i]=0}else if(1-X[i]*X[i]<=0){ST[i]=1;STV[i]=lum(i,0)}
  }
  buildText();
}
addEventListener('resize',resize);
addEventListener('keydown',e=>{if(e.key==='-'||e.key==='+'||e.key==='='||e.key==='0'){sc=e.key==='0'?1:cl(sc*(e.key==='-'?0.92:1.08),0.4,1.6);try{localStorage.setItem('evaScale',sc)}catch(_){}resize()}});

let tx=0,ty=0,ix=0,iy=0,lastMove=-1e9,open=1,bo=1,bDur=0.34,closed=0,wake=0,away=false,pd=0,thm=1,blinkAt=2,bStart=-1,bDbl=false,sacX=0,sacY=0,nextSac=1;
function setT(x,y){lastMove=performance.now();tx=cl((x-W/2)/(W/2)*0.75,-0.5,0.5);ty=cl((y-H/2)/(H/2)*0.2,-0.14,0.14)}
addEventListener('pointermove',e=>setT(e.clientX,e.clientY));
addEventListener('touchmove',e=>{const t=e.touches[0];setT(t.clientX,t.clientY)},{passive:true});

// --- alive: time of day, focus, sound, mic, tilt ---
let sleepy=0,tiltOn=false;
function calcSleepy(){const d=new Date(),h=d.getHours()+d.getMinutes()/60;sleepy=0.5-0.5*Math.cos((h-14)/24*6.2832)}
calcSleepy();setInterval(calcSleepy,60000);
function setAway(a){if(a)away=true;else if(away){away=false;wake=1;closed=Math.max(closed,0.9)}}
addEventListener('blur',()=>setAway(true));addEventListener('focus',()=>setAway(false));
document.addEventListener('visibilitychange',()=>{if(document.hidden){away=true;closed=1}else setAway(false)});
let tiltPending=false;
function tiltInit(){
  if(tiltOn||tiltPending)return;
  const go=()=>{tiltOn=true;addEventListener('deviceorientation',e=>{if(e.gamma==null)return;lastMove=performance.now();
    tx=cl(e.gamma/30*0.5,-0.5,0.5);ty=cl(((e.beta||45)-45)/30*0.14,-0.14,0.14)})};
  const D=window.DeviceOrientationEvent;
  if(D&&typeof D.requestPermission==='function'){
    // iOS: tenta já na abertura (funciona se a permissão já foi dada); senão o 1º toque repete o pedido
    tiltPending=true;
    D.requestPermission().then(r=>{tiltPending=false;if(r==='granted')go()}).catch(()=>{tiltPending=false});
  }else go(); // Android e demais: sem permissão, liga direto
}
tiltInit(); // ativa logo ao abrir o site
['pointerdown','touchend','click'].forEach(ev=>addEventListener(ev,tiltInit,{passive:true}));

function update(t){
  if(performance.now()-lastMove>5000){tx=0.3*Math.sin(t*0.31)+0.12*Math.sin(t*0.9);ty=0.05*Math.sin(t*0.23+1)}
  if(t>nextSac){sacX=(Math.random()-.5)*0.05;sacY=(Math.random()-.5)*0.02;nextSac=t+0.6+Math.random()*2}
  ix+=(tx+sacX-ix)*0.14;iy+=(ty+sacY-iy)*0.14;
  if(bStart<0&&t>blinkAt){bStart=t;bDur=0.34*(1+1.3*sleepy)*(sleepy>0.5&&Math.random()<0.25?1.8:1)}
  if(bStart>=0){
    const p=(t-bStart)/bDur;
    if(p>=1){bStart=-1;bo=1;if(!bDbl&&Math.random()<0.18){bDbl=true;blinkAt=t+0.08}else{bDbl=false;blinkAt=t+(2.2+Math.random()*4.8)*(1.1-0.5*sleepy)}}
    else bo=p<0.36?1-sm(0,1,p/0.36):sm(0,1,(p-0.36)/0.64);
  }else bo=1;
  if(away)closed=Math.min(1,closed+0.03);else closed*=0.55;
  wake*=0.94;
  pd=0.10*wake+0.025*(1-sleepy);
  thm=1-0.30*sleepy+0.05*(1-sleepy)+0.10*wake;
  open=bo*(1-closed);
}

function lash(x,h,len,sp,seed){
  if(h<=0||h>len)return 0;
  const s0=x-0.55*x*h,idx=Math.round(s0/sp);
  for(let j=-1;j<=1;j++){const i=idx+j;if(hash(i,seed+11)<0.14)continue;
    const L=len*(0.55+0.45*hash(i,seed+3));if(h>L)continue;
    const c=i*sp+(hash(i,seed+7)-0.5)*1.1*h,w=0.004+0.010*(1-h/L);
    if(Math.abs(s0-c)<w)return 1}
  return 0;
}

const R=0.36;
function lum(i,t){
  const x=X[i],y=Y[i],a=1-x*x,tilt=-0.06*x;
  let pa=0,tp=tilt,bt=tilt;
  if(a>0){pa=Math.pow(a,0.85);const TH=(0.34-0.35*iy)*thm;
    const top=tilt-TH*pa*(1-0.2*x);bt=tilt+0.26*pa*(1+0.15*x);tp=bt+(top-bt)*open}
  let v;
  if(a>0&&y>tp&&y<bt){
    const dt=y-tp,db=bt-y;
    v=SCT[i];
    if(x<-0.72){const ex=(x+0.9)/0.14,ey=(y-tilt-0.03)/0.10,e=sm(1,0,Math.sqrt(ex*ex+ey*ey));v=v*(1-e)+(0.52+0.2*vn(x*50,y*50))*e}
    const dx=(x-ix)/(1-0.2*Math.abs(ix)),dy=y-iy,r=Math.sqrt(dx*dx+dy*dy)/R;
    if(r<1.06){
      const ang=Math.atan2(dy,dx)/6.2832+0.5,pr=0.34+0.03*Math.sin(t*0.7)+0.02*(1-open)+pd;
      let ir=0.26+0.40*pvn(ang*36,r*3,36)+0.20*pvn(ang*110,r*7+1.5,110);
      ir+=0.30*Math.exp(-Math.pow((r-0.56)/0.10,2));
      ir*=0.55+0.45*sm(pr,pr+0.16,r);
      ir*=1-0.8*sm(0.76,1.0,r);
      ir+=0.14*cl(dy/R,-1,1)*sm(1,0.3,r);
      const pm=sm(pr+0.03,pr-0.015,r);ir=ir*(1-pm)+0.015*pm;
      const e=sm(1.04,0.94,r);v=v*(1-e)+ir*e;
    }
    v*=1-0.6*Math.exp(-dt/0.09);v*=1-0.15*Math.exp(-db/0.05);
    if(dt<0.03)v*=0.15+0.85*sm(0,0.03,dt);
    if(db<0.022)v=Math.max(v,0.95*sm(0.022,0.006,db)+v*0.2);
    let ux=(x-(ix-0.30*R))/(0.26*R),uy=(y-(iy-0.34*R))/(0.21*R);
    v=v+(1-v)*sm(1.05,0.75,Math.sqrt(ux*ux+uy*uy));
    ux=(x-(ix+0.36*R))/(0.10*R);uy=(y-(iy+0.42*R))/(0.09*R);
    v=Math.max(v,0.7*sm(1,0.6,Math.sqrt(ux*ux+uy*uy)));
    if(r<1){ux=(x-(ix-0.2*R))/(0.55*R);uy=(y-(iy-0.25*R))/(0.55*R);v+=0.16*Math.exp(-(ux*ux+uy*uy))}
  }else{
    let above,d;
    if(a<=0){d=Math.abs(y-tilt);above=y<tilt}else if(y<=tp){d=tp-y;above=true}else{d=y-bt;above=false}
    if(above){
      v=0.5-0.08*Math.min(1,Math.abs(x)*0.6)+0.08*sm(0,0.16,d);
      if(d<0.4){const k=(d-0.17)/0.024;v-=0.36*Math.exp(-k*k)}
      const k2=(d-0.33)/0.10;v+=0.13*Math.exp(-k2*k2);
      v-=0.24*sm(0.5,1.0,d);
    }else{
      const k=(d-0.15)/0.07;
      v=0.48-0.16*Math.exp(-k*k)+0.08*sm(0.2,0.5,d)-0.22*sm(0.7,1.2,d);
    }
    if(a>0)v-=0.3*Math.exp(-d/0.012);
    v+=SKT[i]-0.16*sm(-1,-1.7,x);
  }
  if(a>0.02&&(y<tp?tp-y<0.21:y-bt<0.07||y-tp<0.18)){
    const sq=Math.sqrt(a),inner=sm(-0.98,-0.5,x);
    if(y<tp&&lash(x,tp-y,0.20*sq*inner+0.02,0.024,0))v=Math.min(v,0.03);
    else if(y>tp&&open<0.75&&lash(x,y-tp,0.17*sq*(1-open/0.75),0.024,40))v=Math.min(v,0.04);
    if(y>bt&&Math.abs(x)<0.85&&lash(x,y-bt,0.06*sq,0.05,90))v=Math.min(v,0.07);
  }
  v*=VIG[i];
  return v<0?0:v>1?1:v;
}

let last=0,frameN=0,ema=0;
function frame(ms){
  requestAnimationFrame(frame);
  if(ms-last<30)return;last=ms;
  const t=ms/1000,t0=performance.now();update(t);
  const t25=t*2.5;let i=0;
  for(let r=0;r<rows;r++){
    const y0=r*th;
    for(let c=0;c<cols;c++,i++){
      const v=ST[i]?STV[i]:lum(i,t);
      let code=0,g=0,ai=0;
      if(v>=0.02){
        let lv=Math.round(GM[(v*255)|0]+DI[i]);
        if(lv>0){
          if(lv>=NL)lv=NL-1;
          g=off[lv]+((GH[i]*cnt[lv])>>8);
          const fn=(FT[(i*31+Math.floor(t25+PH[i]))&255]-0.5)*0.14;
          ai=cl(Math.floor((0.62+0.38*v+fn-0.28)/0.13),0,NA-1);
          code=g*NA+ai+1;
        }
      }
      if(code!==prev[i]){
        prev[i]=code;const x0=c*tw;
        ctx.clearRect(x0,y0,tw,th);
        if(code)ctx.drawImage(atlas,g*tw,ai*th,tw,th,x0,y0,tw,th);
      }
    }
  }
  // adaptive quality: coarsen the character grid if frames run long
  ema=ema*0.9+(performance.now()-t0)*0.1;
  if(++frameN>40&&ema>20&&q<2.2){q*=1.18;resize();ema=0;frameN=0}
}
resize();getPrice();setInterval(getPrice,60000);requestAnimationFrame(frame);
</script></body></html>
